[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "microduck-challenges"
version = "0.1.0"
description = "One training folder per open Microduck Arena challenge"
readme = "README.md"
# bam and the Arena's golden run both allow exactly 3.12.
requires-python = ">=3.12, <3.13"
dependencies = [
    "mjlab-microduck",
    # Direct dep ONLY so [tool.uv.sources] can bind torch to the CUDA index on
    # aarch64, as in microduck_rl: uv applies sources to direct dependencies only.
    # The exact version microduck_rl locks.
    "torch==2.9.1",
]

# mjlab imports every package that declares this group; importing ours registers
# every challenge's task, so `uv run train <task>` works from this checkout.
[project.entry-points."mjlab.tasks"]
microduck_challenges = "microduck_challenges"

[dependency-groups]
dev = ["pytest>=8.0"]
# The Arena: the evaluator, the event rules and the workshop. Not a default
# group, so the HF job's plain `uv sync` never installs it (it only trains).
workshop = ["microduck-arena"]

[tool.uv]
default-groups = ["dev"]
override-dependencies = [
    # NOTE: do NOT override mujoco — mjlab 1.3.0's mujoco-warp pins a compatible
    # mujoco (3.10.x); an override here previously forced mujoco down to 3.4.0,
    # which lacks mjDSBL_MULTICCD that mujoco-warp 3.8.1 imports → import crash.
    # bam pins protobuf<4.0 (for its zmq/dynamixel messaging, which we don't
    # use — we only import bam.model/bam.actuator). Without this override the
    # downgrade cascades onnx down to 1.17.0, which has no wheel and fails to
    # build from source.
    "protobuf>=4.0,<7.0",
    # Keep onnx on a version with prebuilt wheels (1.17.0 has no py3.13 wheel and
    # fails to build from source). Pulling in bam otherwise nudges it downward.
    "onnx>=1.20.1",
    # bam depends on the PyPI stub `zmq==0.0.0`, whose prebuilt wheel is invalid
    # (missing .dist-info) -> `uv sync` fails on a FRESH install (e.g. HF Jobs
    # remote build), even though a warm local cache tolerated it. We only use
    # bam.mjlab (no zmq/erob messaging), so drop zmq via an always-false marker.
    "zmq ; python_version < '3.0'",
    # Name only: makes the [tool.uv.sources] pin below apply to mjlab-microduck's
    # transitive requirement too (uv applies sources to direct deps and overrides only).
    "better-actuator-models",
]

[tool.uv.sources]
# Plan 1 of the workshop, in review as microduck_rl#57; `develop` once it merges.
# Keep this branch on GitHub until this source moves to `develop` and the lock
# is re-made: an un-frozen `uv sync` (as in an HF job) fetches it directly.
mjlab-microduck = { git = "https://github.com/pollen-robotics/microduck_rl", branch = "challenge-recipe-publishing" }
# The Arena's wheel, as its release workflow attaches it to the tag.
microduck-arena = { url = "https://github.com/pollen-robotics/microduck-arena/releases/download/v0.5.0/microduck_arena-0.5.0-py3-none-any.whl" }
# Official BAM actuator model. Pinned to the exact commit microduck_rl's own
# uv.lock uses: the `mjlab_frictionloss` branch moved (now 57d13ea) and
# mjlab_microduck no longer imports against its head (FrictionDRBamActuatorCfg
# has no vin_drop_gain_range there). Move this pin together with microduck_rl's lock.
better-actuator-models = { git = "https://github.com/Rhoban/bam.git", rev = "62bd8ce12154340be97e06f7f41a0ca8f116d967" }
# For local BAM development, comment the line above and use:
# better-actuator-models = { path = "/home/antoine/Rhoban/bam", editable = true }
# On linux-aarch64 (DGX Spark / GB10) PyPI's torch wheel is CPU-ONLY:
# torch.__version__ == "2.9.1+cpu", torch.version.cuda is None, so
# torch.cuda.device_count() == 0 and mjlab's select_gpus() indexes an empty
# list -> `IndexError: list index out of range` before training even starts
# (mjlab/utils/gpu.py:70). Route torch to PyTorch's CUDA index there.
# cu129 (not cu130) matches the CUDA toolkit warp 1.12.0 bundles, so the
# zero-copy warp<->torch interop stays on one runtime major version.
# The marker keeps x86_64 (HF Jobs) on PyPI, where the wheel already bundles
# CUDA via its nvidia-*-cu12 deps — that resolution is unchanged.
torch = [
  { index = "pytorch-cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
# explicit: only packages that name this index resolve from it.
explicit = true
