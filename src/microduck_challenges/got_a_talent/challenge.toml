# MicroDuck Got a Talent: a 20 s performance on a stage. The Arena plays your
# timeline.json (when to cartwheel, and which way); visitors vote.
# Nothing is timed. Make the moves yours.
event = "got-a-talent"
task  = "Mjlab-GotATalent-MicroDuck"
kind  = "perpetual"

# What the policy reads in each command group: publish writes it in the manifest.
[command]
twist = "[0, cartwheel trigger: +1 for 0.5 s cartwheels to its left, -1 to its right, 0 stands; 0]"
head  = "unused (zeros)"

[recipe]                  # the first training, as is
num_envs       = 1536     # the most an 8 GB GPU holds with this env's contact buffer
max_iterations = 6000
seed           = 1

[params.idle_reward]
label = "Stand still until told"
value = 4.0
min   = 0.0
max   = 8.0

[params.turn_reward]
label = "Turn the cartwheel"
value = 8.0
min   = 2.0
max   = 16.0

[params.landing_reward]
label = "Land on the feet"
value = 4.0
min   = 1.0
max   = 8.0
